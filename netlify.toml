[build]
  command = "npm run build"
  publish = "out"

# Static export writes the generated card as an extensionless file. Without
# this, Netlify serves it as octet-stream and every crawler drops the preview.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
